name: Paired Speech Quality Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/dns3-quality-benchmark.yml"
  workflow_dispatch:
    inputs:
      pairs_to_test:
        description: "Number of paired clips to evaluate (1–10)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: paired-speech-quality-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark on VoiceBank-DEMAND paired test speech
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate pair count
        env:
          PAIRS_TO_TEST: ${{ inputs.pairs_to_test }}
        run: |
          python3 - <<'PY'
          import os
          value = int(os.environ["PAIRS_TO_TEST"])
          if not 1 <= value <= 10:
              raise SystemExit("pairs_to_test must be between 1 and 10")
          PY

      - name: Download paired clean and noisy test sets
        run: |
          mkdir -p dataset/clean dataset/noisy dataset/converted benchmark-output
          # DSpace may return an HTML landing/error page with HTTP 200 unless the
          # download query is explicit. Retry transient upstream failures and then
          # validate both size and ZIP structure before attempting extraction.
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 --proto '=https' \
            --max-filesize 300000000 \
            'https://datashare.ed.ac.uk/bitstreams/dec213d3-bf57-4777-9663-c24bdce92d5e/download' \
            --output dataset/clean-test.zip
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 3 --proto '=https' \
            --max-filesize 300000000 \
            'https://datashare.ed.ac.uk/bitstreams/13c1bfbf-14a6-41db-9b41-8f7310f01ad5/download' \
            --output dataset/noisy-test.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          expected_minimum_bytes = 10_000_000
          for archive in (Path("dataset/clean-test.zip"), Path("dataset/noisy-test.zip")):
              size = archive.stat().st_size if archive.exists() else 0
              if size < expected_minimum_bytes:
                  raise SystemExit(
                      f"{archive} is only {size:,} bytes; expected a dataset archive. "
                      "The upstream server may have returned an HTML page instead of the ZIP."
                  )
              if not zipfile.is_zipfile(archive):
                  raise SystemExit(
                      f"{archive} is not a valid ZIP archive (downloaded {size:,} bytes)."
                  )
              with zipfile.ZipFile(archive) as zf:
                  bad_member = zf.testzip()
                  if bad_member:
                      raise SystemExit(f"{archive} has a corrupt member: {bad_member}")
              print(f"Validated {archive}: {size:,} bytes")
          PY
          ls -lh dataset/*-test.zip

      - name: Safely extract and match paired clips
        env:
          PAIRS_TO_TEST: ${{ inputs.pairs_to_test }}
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          archives = [
              (Path("dataset/clean-test.zip"), Path("dataset/clean")),
              (Path("dataset/noisy-test.zip"), Path("dataset/noisy")),
          ]
          listings = []
          for archive, root in archives:
              resolved_root = root.resolve()
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      name = PurePosixPath(info.filename)
                      listings.append(f"{archive.name}\t{info.filename}")
                      if info.is_dir() or name.is_absolute() or ".." in name.parts:
                          continue
                      if name.suffix.lower() != ".wav":
                          continue
                      destination = (resolved_root / Path(*name.parts)).resolve()
                      if resolved_root not in destination.parents:
                          raise SystemExit(f"Unsafe archive path: {info.filename}")
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, destination.open("wb") as output:
                          while True:
                              block = source.read(1024 * 1024)
                              if not block:
                                  break
                              output.write(block)

          Path("benchmark-output/dataset-file-list.txt").write_text(
              "\n".join(listings) + "\n", encoding="utf-8"
          )

          def wav_map(root):
              result = {}
              for path in root.rglob("*.wav"):
                  # VoiceBank-DEMAND pairs share the same basename. Reject ambiguous duplicates.
                  key = path.name.lower()
                  if key in result:
                      raise SystemExit(f"Duplicate WAV basename in {root}: {key}")
                  result[key] = path
              return result

          clean = wav_map(Path("dataset/clean"))
          noisy = wav_map(Path("dataset/noisy"))
          common = sorted(set(clean) & set(noisy))
          report = [
              f"Clean WAV count: {len(clean)}",
              f"Noisy WAV count: {len(noisy)}",
              f"Matched basename pairs: {len(common)}",
              f"Clean-only WAV count: {len(set(clean) - set(noisy))}",
              f"Noisy-only WAV count: {len(set(noisy) - set(clean))}",
          ]
          report.extend(f"{name}\t{clean[name]}\t{noisy[name]}" for name in common)
          Path("benchmark-output/pair-discovery.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report[:20]))
          if not common:
              raise SystemExit("No paired clean/noisy WAV basenames were found.")

          count = int(os.environ["PAIRS_TO_TEST"])
          with Path("benchmark-output/pairs.tsv").open("w", encoding="utf-8") as out:
              for index, name in enumerate(common[:count], start=1):
                  out.write(f"{index:02d}\t{clean[name]}\t{noisy[name]}\n")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Convert matched clips to aligned mono 48 kHz WAVs
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r index clean noisy; do
            ffmpeg -nostdin -v error -y -i "$clean" -ac 1 -ar 48000 -c:a pcm_s16le "dataset/converted/clean-$index.wav"
            ffmpeg -nostdin -v error -y -i "$noisy" -ac 1 -ar 48000 -c:a pcm_s16le "dataset/converted/noisy-$index.wav"
            clean_duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "dataset/converted/clean-$index.wav")
            noisy_duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "dataset/converted/noisy-$index.wav")
            python3 - "$clean_duration" "$noisy_duration" "$index" <<'PY'
          import sys
          clean, noisy = float(sys.argv[1]), float(sys.argv[2])
          if abs(clean - noisy) > 0.002:
              raise SystemExit(f"Pair {sys.argv[3]} duration mismatch after conversion: clean={clean:.6f}s noisy={noisy:.6f}s")
          PY
          done < benchmark-output/pairs.tsv

      - name: Build benchmark dependencies
        run: cargo build --release --features cli --example quality_benchmark

      - name: Run paired benchmarks
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r index clean noisy; do
            echo "===== VoiceBank-DEMAND pair $index =====" | tee -a benchmark-output/report.txt
            cargo run --release --features cli --example quality_benchmark -- \
              "dataset/converted/clean-$index.wav" "dataset/converted/noisy-$index.wav" models "benchmark-output/pair-$index" \
              2>&1 | tee -a benchmark-output/report.txt
          done < benchmark-output/pairs.tsv

      - name: Upload metrics, diagnostics, and listening WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-speech-quality-benchmark-${{ github.run_number }}
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rnnoise:
    name: RNNoise (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build (default = rnnoise)
        run: cargo build --release
      - name: Build with CLI
        run: cargo build --release --features cli
      - name: Run example
        run: cargo run --release --example offline_denoise --features cli
      - name: Tests
        run: cargo test --release --features rnnoise

  deepfilternet:
    name: DeepFilterNet3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cache DFN3 models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: dfn3-onnx-v1
      - name: Fetch DFN3 ONNX (CI only – library never downloads)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sL "https://github.com/Rikorose/DeepFilterNet/raw/main/models/DeepFilterNet3_onnx.tar.gz" -o /tmp/dfn3.tar.gz
          tar -xzf /tmp/dfn3.tar.gz -C /tmp
          find /tmp -name 'enc.onnx' -exec cp {} models/ \;
          find /tmp -name 'erb_dec.onnx' -exec cp {} models/ \;
          find /tmp -name 'df_dec.onnx' -exec cp {} models/ \;
          ls -lh models/
      - name: Build deepfilternet + cli
        run: cargo build --release --features "cli,deepfilternet"
      - name: Build-check library only
        run: cargo build --release --features deepfilternet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --features rnnoise -- -D warnings

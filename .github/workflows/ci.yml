name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rnnoise:
    name: RNNoise (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build (default = rnnoise)
        run: cargo build --release
      - name: Build with CLI + c-api
        run: cargo build --release --features "cli,c-api"
      - name: Tests
        run: cargo test --release --features rnnoise
      - name: Resample + multi-channel smoke
        run: |
          cargo test --release --features rnnoise --test resample_smoke
          cargo test --release --features rnnoise --test multi_channel_smoke

  deepfilternet:
    name: DeepFilterNet3 (vendored models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify vendored models
        run: |
          test -f models/enc.onnx
          test -f models/erb_dec.onnx
          test -f models/df_dec.onnx
          ls -lh models/
      - name: Build deepfilternet
        run: cargo build --release --features deepfilternet
      - name: DeepFilterNet3 smoke tests
        run: cargo test --release --features deepfilternet --test dfn3_smoke

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features rnnoise -- -D warnings

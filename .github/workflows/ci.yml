name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rnnoise:
    name: RNNoise (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Build (default = rnnoise + deepfilternet)
        run: cargo build --release
      - name: Build with CLI + c-api
        run: cargo build --release --features "cli,c-api"
      - name: Offline CLI tests
        run: cargo test --release --features cli --bin noise-cancel
      - name: Paired speech quality benchmark tests
        run: cargo test --release --features cli --example quality_benchmark
      - name: Build RNNoise-only (no default features)
        run: cargo build --release --no-default-features --features rnnoise
      - name: Tests (RNNoise)
        run: cargo test --release --no-default-features --features rnnoise
      - name: C ABI overlap safety tests
        run: cargo test --release --no-default-features --features "rnnoise,c-api" --lib overlap_tests
      - name: Resample + multi-channel smoke
        run: |
          cargo test --release --no-default-features --features rnnoise --test resample_smoke
          cargo test --release --no-default-features --features rnnoise --test multi_channel_smoke

  deepfilternet:
    name: DeepFilterNet3 (vendored models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify vendored models
        run: |
          test -f models/enc.onnx
          test -f models/erb_dec.onnx
          test -f models/df_dec.onnx
          ls -lh models/
      - name: Build deepfilternet-only
        run: cargo build --release --no-default-features --features deepfilternet
      - name: Build default (both engines)
        run: cargo build --release
      - name: DeepFilterNet3 smoke tests
        run: cargo test --release --features deepfilternet --test dfn3_smoke

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default = both engines)
        run: cargo clippy -- -D warnings
      - name: Clippy (RNNoise-only)
        run: cargo clippy --no-default-features --features rnnoise -- -D warnings

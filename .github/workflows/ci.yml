name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rnnoise:
    name: RNNoise (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build (default = rnnoise)
        run: cargo build --release
      - name: Build with CLI
        run: cargo build --release --features cli
      - name: Run example
        run: cargo run --release --example offline_denoise --features cli
      - name: Tests
        run: cargo test --release --features rnnoise

  deepfilternet:
    name: DeepFilterNet3 (vendored models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Verify vendored models
        run: |
          test -f models/enc.onnx
          test -f models/erb_dec.onnx
          test -f models/df_dec.onnx
          ls -lh models/
      - name: Build deepfilternet + cli
        run: cargo build --release --features "cli,deepfilternet"
      - name: Build-check library only
        run: cargo build --release --features deepfilternet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --features rnnoise -- -D warnings

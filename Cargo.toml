[package]
name = "noise_cancellation"
version = "0.2.1"
edition = "2021"
description = "High-quality real-time and offline noise cancellation library (DeepFilterNet3 + RNNoise)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/R-6167/noise-cancellation-model"
keywords = ["audio", "noise-suppression", "speech-enhancement", "deepfilternet", "rnnoise"]
categories = ["multimedia::audio", "science"]
readme = "README.md"

[features]
default = ["rnnoise"]
rnnoise = ["dep:nnnoiseless"]
deepfilternet = ["dep:ort", "dep:ndarray", "dep:realfft", "dep:rustfft"]
c-api = []
cli = ["dep:clap", "dep:hound", "rnnoise"]

[dependencies]
nnnoiseless = { version = "0.5", optional = true }
ort = { version = "2", optional = true, default-features = false, features = ["download-binaries", "ndarray"] }
ndarray = { version = "0.16", optional = true }
realfft = { version = "3", optional = true }
rustfft = { version = "6", optional = true }
thiserror = "2"
log = "0.4"

clap = { version = "4", features = ["derive"], optional = true }
hound = { version = "3.5", optional = true }

[dev-dependencies]
hound = "3.5"

[[example]]
name = "offline_denoise"
required-features = ["cli", "rnnoise"]

[[bin]]
name = "noise-cancel"
path = "src/bin/noise_cancel.rs"
required-features = ["cli"]

[lib]
name = "noise_cancellation"
crate-type = ["lib", "cdylib", "staticlib"]
